# Publishes a release when a version tag (v<MARKETING_VERSION>) on main is pushed: the notarized DMG and Sparkle's
# appcast.xml, nothing else (docs/RELEASING.md).
#
# It runs on GitHub's hosted `xcode-27` image (macOS 27, Xcode 27), a fresh virtual machine for every run: the
# repository is public, and a self-hosted runner would run code from anyone's pull request on that Mac.
#
# Secrets live in the `release` environment, so only this workflow can read them (the same certificate and API key as
# Folio's):
#   CSC_LINK, CSC_KEY_PASSWORD          Developer ID Application certificate (.p12, base64) and its password
#   APPLE_API_KEY                       App Store Connect API key (.p8 contents), for notarytool
#   APPLE_API_KEY_ID, APPLE_API_ISSUER  its Key ID and Issuer ID
#   SPARKLE_PRIVATE_KEY                 Sparkle's EdDSA private key (`generate_keys -x`), which signs the update
#
# The certificate goes into a temporary keychain under RUNNER_TEMP for the build; the last step deletes it and the key
# files whatever happened. The debug symbols are kept as a workflow artifact for 90 days, not in the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: xcode-27
    environment: release
    # Notarization usually takes a few minutes, now and then much longer.
    timeout-minutes: 120
    defaults:
      run:
        shell: zsh {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read the commits since the previous release.
          fetch-depth: 0

      # scripts/release.sh runs dmgbuild through uv.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Check the tag
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          version=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' Tidemark.xcodeproj/project.pbxproj | cut -d' ' -f3)
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match MARKETING_VERSION $version"
            exit 1
          fi
          if grep -q 'SPARKLE_PUBLIC_ED_KEY = "";' Tidemark.xcodeproj/project.pbxproj; then
            echo "::error::SPARKLE_PUBLIC_ED_KEY is empty: the release could not update itself"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main"
            exit 1
          fi

      - name: Set up signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${(P)name}" ]]; then
              echo "::error::The release environment has no $name secret"
              exit 1
            fi
          done
          secrets="$RUNNER_TEMP/tidemark-signing"
          mkdir -p "$secrets"
          print -r -- "$CSC_LINK" | base64 --decode > "$secrets/certificate.p12"
          print -r -- "$APPLE_API_KEY" > "$secrets/notary-key.p8"
          print -r -- "$SPARKLE_PRIVATE_KEY" > "$secrets/sparkle.key"

          # Kept for the clean-up step, which puts the search list back.
          security list-keychains -d user | sed -E 's/^ *"(.*)"$/\1/' > "$secrets/search-list"
          keychain="$RUNNER_TEMP/tidemark-signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$secrets/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # codesign trusts the certificate only through Apple's "Developer ID Certification Authority" (G2)
          # intermediate, which a fresh Mac lacks: it goes into the same keychain, checked against its fingerprint.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$secrets/DeveloperIDG2CA.cer"
          fingerprint=$(openssl x509 -inform DER -in "$secrets/DeveloperIDG2CA.cer" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          if [[ "$fingerprint" != "5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635" ]]; then
            echo "::error::Apple's Developer ID G2 intermediate has an unexpected fingerprint: $fingerprint"
            exit 1
          fi
          security import "$secrets/DeveloperIDG2CA.cer" -k "$keychain"
          security list-keychains -d user -s "$keychain" ${(f)"$(<"$secrets/search-list")"}
          rm -f "$secrets/certificate.p12"
          print "TIDEMARK_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          TIDEMARK_NOTARY_KEY: ${{ runner.temp }}/tidemark-signing/notary-key.p8
          TIDEMARK_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          TIDEMARK_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/release.sh

      - name: Write the release notes and appcast
        env:
          SPARKLE_KEY_FILE: ${{ runner.temp }}/tidemark-signing/sparkle.key
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$GITHUB_REF_NAME" > build/release/notes.md
          scripts/appcast.sh build/release/notes.md

      # A draft until both files are up: the app's feed follows the latest published release.
      - name: Publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const env = Object.fromEntries(fs.readFileSync('build/release/release.env', 'utf8').trim().split('\n').map((line) => line.split('=')));
            const [heading, ...rest] = fs.readFileSync('build/release/notes.md', 'utf8').split('\n');
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: heading.replace(/^# /, ''), body: rest.join('\n').trim(), draft: true,
            });
            const files = [
              [`Tidemark-${env.VERSION}.dmg`, 'application/x-apple-diskimage'],
              ['appcast.xml', 'application/xml'],
            ];
            for (const [name, type] of files) {
              const data = fs.readFileSync(`build/release/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: { 'content-type': type, 'content-length': data.length },
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, make_latest: 'true' });

      - name: Keep the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tidemark-${{ github.ref_name }}-dSYM
          path: build/release/*.dSYM
          retention-days: 90
          if-no-files-found: error

      - name: Remove the keychain and key files
        if: always()
        run: |
          secrets="$RUNNER_TEMP/tidemark-signing"
          if [[ -f "$secrets/search-list" ]]; then
            security list-keychains -d user -s ${(f)"$(<"$secrets/search-list")"}
          fi
          keychain="$RUNNER_TEMP/tidemark-signing.keychain-db"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain" || rm -f "$keychain"
          fi
          rm -rf "$secrets"
