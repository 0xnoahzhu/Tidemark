name: Tidemark

options:
  bundleIdPrefix: io.tidemark
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio.git
    from: "1.33.2"

targets:
  Tidemark:
    type: application
    platform: macOS
    sources:
      - path: Tidemark
    dependencies:
      - package: PostgresNIO
    info:
      path: Tidemark/Info.plist
      properties:
        CFBundleDisplayName: Tidemark
        CFBundleName: Tidemark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Keeps every Surge request in PostgreSQL."
    entitlements:
      path: Tidemark/Tidemark.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Tidemark
        PRODUCT_BUNDLE_IDENTIFIER: io.tidemark.Tidemark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  TidemarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TidemarkTests
    dependencies:
      - target: Tidemark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tidemark.TidemarkTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tidemark.app/Contents/MacOS/Tidemark
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Tidemark:
    build:
      targets:
        Tidemark: all
        TidemarkTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TidemarkTests
    archive:
      config: Release
